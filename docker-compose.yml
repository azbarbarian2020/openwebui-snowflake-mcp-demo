services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-mcp-demo
    ports:
      - "3002:8080"
    volumes:
      - open-webui-mcp-demo-data:/app/backend/data
      - ./config/user_credentials.json:/app/backend/data/user_credentials.json:ro
    environment:
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
    restart: unless-stopped

volumes:
  open-webui-mcp-demo-data:
